name: Deploy to Oracle Cloud VM

# Oracle is production (marketsignal.vigyatri.com), replacing the GCP Cloud
# Run deploy while GCP billing is unresolved. Same tag-based promotion pattern
# as deploy-gcp.yml: push a version tag to go live, or run manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SERVICE: marketsignal

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          install -m 600 -D /dev/null key.pem
          echo "$ORACLE_SSH_KEY" > key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new ubuntu@"$ORACLE_HOST" '
            set -e
            cd ~/apps/NewsToStocks && git fetch --tags && git checkout "${{ github.ref_name }}"
            cd ~/apps/deploy-oracle && docker compose up -d --build ${{ env.SERVICE }}
          '

      - name: Summary
        run: |
          echo "## MarketSignal deployed to Oracle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** https://marketsignal.vigyatri.com" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
